<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名鉄回送情報共有</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #f5f5f5;
            padding-bottom: 90px;
        }
        header {
            background-color: #d0021b;
            color: #ffffff;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: bold;
        }
        main {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }
        .form-card, .info-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }
        .sub-tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .sub-tab-btn {
            flex: 1;
            padding: 10px 0;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
            color: #555;
            cursor: pointer;
            text-align: center;
        }
        .sub-tab-btn.active {
            background-color: #d0021b;
            color: #ffffff;
            border-color: #d0021b;
        }
        .sub-form-section {
            display: none;
        }
        .sub-form-section.active {
            display: block;
        }
        .manual-section {
            margin-bottom: 20px;
        }
        .manual-section:last-child {
            margin-bottom: 0;
        }
        .manual-title {
            font-size: 16px;
            font-weight: bold;
            color: #d0021b;
            border-bottom: 2px solid #d0021b;
            padding-bottom: 4px;
            margin-bottom: 8px;
        }
        .manual-body {
            font-size: 14px;
            color: #444;
            line-height: 1.6;
        }
        .news-item {
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .news-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }
        .news-date {
            font-size: 12px;
            color: #d0021b;
            font-weight: bold;
        }
        .news-title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin: 4px 0;
        }
        .news-body {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
        .post-card {
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }
        .post-card.weekday {
            background-color: #ffffff;
        }
        .post-card.holiday {
            background-color: #fff0f3;
            border: 1px solid #ffccd5;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
            color: #333;
        }
        .schedule-btn-group, .direction-btn-group {
            display: flex;
            gap: 10px;
        }
        .schedule-btn, .direction-type-btn {
            flex: 1;
            padding: 12px 0;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
            color: #555;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .schedule-btn.active, .direction-type-btn.active {
            background-color: #d0021b;
            color: #ffffff;
            border-color: #d0021b;
        }
        .optional-badge {
            font-size: 11px;
            background-color: #e0e0e0;
            color: #666;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
        }
        .time-condition-note {
            font-size: 12px;
            color: #d0021b;
            margin-top: -10px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }
        .form-control:focus {
            border-color: #d0021b;
        }
        .form-control:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
            color: #6c757d;
        }
        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }
        .single-formation-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .unknown-toggle-btn {
            background-color: #f0f0f0;
            color: #333;
            border: 1px solid #ccc;
            padding: 0 12px;
            height: 48px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .unknown-toggle-btn.active {
            background-color: #6c757d;
            color: #ffffff;
            border-color: #6c757d;
        }
        .coupling-option-container {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
        }
        .coupling-toggle-btn {
            background-color: #e0e0e0;
            color: #333;
            border: 1px solid #ccc;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .coupling-toggle-btn.active {
            background-color: #d0021b;
            color: #ffffff;
            border-color: #d0021b;
        }
        .coupling-desc {
            font-size: 12px;
            color: #555;
            font-weight: bold;
        }
        .coupling-inputs-area {
            display: none;
            margin-top: 10px;
            padding: 12px;
            background-color: #f8f9fa;
            border: 1px dashed #d0021b;
            border-radius: 8px;
        }
        .coupling-inputs-area.active {
            display: block;
        }
        .coupling-guide-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
            color: #d0021b;
            margin-bottom: 4px;
            padding: 0 4px;
        }
        .coupling-row-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .coupling-row-horizontal {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: nowrap;
            overflow-x: auto;
            flex: 1;
        }
        .coupling-item-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
            flex: 1;
        }
        .coupling-field {
            width: 100%;
            padding: 8px 4px;
            text-align: center;
            font-size: 14px;
        }
        .coupling-unknown-btn {
            margin-top: 4px;
            background-color: #f0f0f0;
            color: #555;
            border: 1px solid #ccc;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .coupling-unknown-btn.active {
            background-color: #6c757d;
            color: #ffffff;
            border-color: #6c757d;
        }
        .coupling-actions {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
        }
        .coupling-action-btn {
            color: white;
            border: none;
            width: 32px;
            height: 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-add-green {
            background-color: #28a745;
        }
        .btn-remove-red {
            background-color: #dc3545;
        }
        .suji-station-box {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            position: relative;
        }
        .suji-station-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #333;
        }
        .suji-inline-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            margin-bottom: 8px;
        }
        .suji-inline-row .form-group {
            margin-bottom: 0 !important;
            flex: 1;
        }
        .search-box-card {
            background: #ffffff;
            padding: 14px 16px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            margin-bottom: 15px;
        }
        .search-input {
            border-color: #ddd;
            background-color: #fafafa;
            margin-bottom: 10px;
        }
        .filter-buttons {
            display: flex;
            gap: 8px;
        }
        .filter-btn {
            flex: 1;
            padding: 8px 0;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-color: #f9f9f9;
            color: #555;
            cursor: pointer;
        }
        .filter-btn.active {
            background-color: #d0021b;
            color: #ffffff;
            border-color: #d0021b;
        }
        .submit-btn {
            width: 100%;
            background-color: #d0021b;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .submit-btn:disabled {
            background-color: #d4edda !important;
            color: #155724 !important;
            cursor: not-allowed;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .section-header h2 {
            font-size: 18px;
            color: #333;
            margin: 0;
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #d0021b;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .post-title {
            font-size: 17px;
            font-weight: bold;
            color: #d0021b;
        }
        .post-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
        }
        .post-remarks {
            background-color: rgba(0,0,0,0.03);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #555;
            margin-top: 8px;
        }
        .suji-card {
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 12px;
            cursor: pointer;
            border-left: 5px solid #d0021b;
            transition: transform 0.1s;
        }
        .suji-card:hover {
            transform: scale(1.01);
        }
        .suji-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
        }
        .suji-timeline-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        .suji-timeline-row:last-child {
            border-bottom: none;
        }
        .empty-msg {
            text-align: center;
            color: #888;
            padding: 30px 0;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #ffffff;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #d0021b;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .close-modal-btn {
            background: #eee;
            border: none;
            font-size: 16px;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            border-top: 1px solid #e0e0e0;
            z-index: 100;
        }
        .footer-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 80px;
            max-width: 600px;
            margin: 0 auto;
        }
        .footer-btn {
            background-color: #eeeeee;
            border: none;
            color: #333333;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.2;
            padding: 0;
        }
        .footer-btn.active {
            background-color: #d0021b;
            color: #ffffff;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <header>
        <h1>名鉄回送情報共有</h1>
    </header>

    <main>
        <section id="latest-view" class="view-section active">
            <h2 style="font-size: 18px; color: #333; margin-top: 0;">最新のお知らせ</h2>
            <div class="info-card">
                <div class="news-item">
                    <div class="news-date">8月14日</div>
                    <div class="news-title">「名鉄回送情報共有」公開</div>
                    <div class="news-body">
                        名鉄回送情報共有Webアプリを公開しました。回送情報の検索や運用履歴の確認が可能です。
                    </div>
                </div>
            </div>
        </section>

        <section id="manual-view" class="view-section">
            <div class="form-card">
                <div class="manual-section">
                    <div class="manual-title">はじめに</div>
                    <div class="manual-body">
                        このサイトは名鉄(名古屋鉄道)の回送の情報を共有するプラットフォームです。2026年7月11日以降の回送電車の目撃、スジの提供共有します。
                    </div>
                </div>
            </div>
        </section>

        <section id="post-view" class="view-section">
            <div class="form-card">
                <h2 style="margin-top:0; font-size:18px; color:#d0021b;">情報の投稿</h2>
                
                <div class="sub-tab-container">
                    <button type="button" class="sub-tab-btn active" id="subTabWitnessBtn" onclick="switchSubTab('witness')">回送目撃情報</button>
                    <button type="button" class="sub-tab-btn" id="subTabSujiBtn" onclick="switchSubTab('suji')">スジ投稿</button>
                </div>

                <div id="witnessFormSection" class="sub-form-section active">
                    <form id="postForm" onsubmit="handlePost(event)">
                        <div class="form-group">
                            <label>ダイヤ種别 <span style="color:red;">*</span></label>
                            <div class="schedule-btn-group">
                                <button type="button" class="schedule-btn" id="btn-post-weekday" onclick="selectPostSchedule('weekday')">平日ダイヤ</button>
                                <button type="button" class="schedule-btn" id="btn-post-holiday" onclick="selectPostSchedule('holiday')">休日ダイヤ</button>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="trainNumber">列番 <span class="optional-badge">任意</span></label>
                            <input type="text" id="trainNumber" class="form-control" placeholder="例: K2391S" maxlength="8">
                        </div>

                        <div class="form-group">
                            <label for="station">確認駅 <span style="color:red;">*</span></label>
                            <input type="text" id="station" class="form-control" placeholder="例: 須ヶ口" maxlength="30" required>
                        </div>

                        <div class="form-group">
                            <label>方面 / 行先 <span style="color:red;">*</span></label>
                            <div class="direction-btn-group" style="margin-bottom: 8px;">
                                <button type="button" class="direction-type-btn" id="btn-dir-houmen" onclick="selectDirectionType('方面')">方面</button>
                                <button type="button" class="direction-type-btn" id="btn-dir-yukisaki" onclick="selectDirectionType('行先')">行先</button>
                            </div>
                            <input type="text" id="direction" class="form-control" placeholder="例: 犬山" maxlength="30" required>
                        </div>

                        <div class="form-group">
                            <label for="formation">編成番号 <span style="color:red;">*</span></label>
                            <div class="single-formation-wrapper">
                                <input type="text" id="formation" class="form-control" inputmode="numeric" placeholder="例: 3501" maxlength="4" oninput="onlyNumbers(this)" required>
                                <button type="button" id="singleUnknownBtn" class="unknown-toggle-btn" onclick="toggleSingleUnknown()">不明</button>
                            </div>
                            
                            <div class="coupling-option-container">
                                <span class="coupling-desc">併結有</span>
                                <button type="button" id="couplingToggleBtn" class="coupling-toggle-btn" onclick="toggleCoupling()">OFF</button>
                            </div>

                            <div id="couplingInputsArea" class="coupling-inputs-area">
                                <div class="coupling-guide-header">
                                    <span>ト方</span>
                                    <span>キ方</span>
                                </div>
                                <div class="coupling-row-wrapper">
                                    <div id="couplingInputsList" class="coupling-row-horizontal"></div>
                                    <div class="coupling-actions">
                                        <button type="button" class="coupling-action-btn btn-add-green" onclick="addCouplingField()">＋</button>
                                        <button type="button" class="coupling-action-btn btn-remove-red" onclick="removeCouplingField()">－</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <p class="time-condition-note">※ 通過・到着・発車のうち少なくとも1つの入力が必要です</p>

                        <div class="form-group">
                            <label for="passingTime">通過時刻 <span class="optional-badge">任意</span></label>
                            <input type="text" id="passingTime" class="form-control" inputmode="numeric" placeholder="例: 123" maxlength="5" onblur="finalizeTimeFormat(this)">
                        </div>

                        <div class="form-group">
                            <label for="arrivalTime">到着時刻 <span class="optional-badge">任意</span></label>
                            <input type="text" id="arrivalTime" class="form-control" inputmode="numeric" placeholder="例: 456" maxlength="5" onblur="finalizeTimeFormat(this)">
                        </div>

                        <div class="form-group">
                            <label for="departureTime">発車時刻 <span class="optional-badge">任意</span></label>
                            <input type="text" id="departureTime" class="form-control" inputmode="numeric" placeholder="例: 758" maxlength="5" onblur="finalizeTimeFormat(this)">
                        </div>

                        <div class="form-group">
                            <label for="remarks">備考欄 <span class="optional-badge">任意</span></label>
                            <textarea id="remarks" class="form-control" placeholder="備考情報"></textarea>
                        </div>

                        <button type="submit" class="submit-btn">目撃情報を投稿する</button>
                    </form>
                </div>

                <div id="sujiFormSection" class="sub-form-section">
                    <form id="sujiPostForm" onsubmit="handleSujiPost(event)">
                        <div class="form-group">
                            <label>ダイヤ種別 <span style="color:red;">*</span></label>
                            <div class="schedule-btn-group">
                                <button type="button" class="schedule-btn" id="btn-suji-post-weekday" onclick="selectSujiPostSchedule('weekday')">平日ダイヤ</button>
                                <button type="button" class="schedule-btn" id="btn-suji-post-holiday" onclick="selectSujiPostSchedule('holiday')">休日ダイヤ</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="sujiTrainNumber">列番 <span style="color:red;">*</span></label>
                            <input type="text" id="sujiTrainNumber" class="form-control" placeholder="例: K2391S" maxlength="8" required>
                        </div>

                        <div class="form-group">
                            <label for="sujiSyotei">所定 <span style="color:red;">*</span></label>
                            <input type="text" id="sujiSyotei" class="form-control" placeholder="例: 3500系4両" maxlength="30" required>
                        </div>

                        <div class="suji-station-box">
                            <div class="suji-station-header"><span>始発駅 (必須)</span></div>
                            <div class="suji-inline-row">
                                <div class="form-group"><label style="font-size:12px;">駅名 *</label><input type="text" id="sujiStartStationName" class="form-control" placeholder="豊明" required></div>
                                <div class="form-group"><label style="font-size:12px;">入線</label><input type="text" id="sujiStartEnterTime" class="form-control" inputmode="numeric" maxlength="5" onblur="finalizeTimeFormat(this)"></div>
                                <div class="form-group"><label style="font-size:12px;">発車 *</label><input type="text" id="sujiStartDepTime" class="form-control" inputmode="numeric" maxlength="5" onblur="finalizeTimeFormat(this)" required></div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>途中の駅 <span class="optional-badge">任意</span></label>
                            <div id="sujiMiddleStationsContainer"></div>
                            <button type="button" class="submit-btn" style="background-color:#6c757d; font-size:14px; padding:10px; margin-top:8px;" onclick="addSujiMiddleStationField()">＋ 途中駅を追加</button>
                        </div>

                        <div class="suji-station-box">
                            <div class="suji-station-header"><span>終着駅 (必須)</span></div>
                            <div class="suji-inline-row">
                                <div class="form-group"><label style="font-size:12px;">駅名 *</label><input type="text" id="sujiEndStationName" class="form-control" placeholder="名鉄岐阜" required></div>
                                <div class="form-group"><label style="font-size:12px;">到着時刻 *</label><input type="text" id="sujiEndArrTime" class="form-control" inputmode="numeric" maxlength="5" onblur="finalizeTimeFormat(this)" required></div>
                            </div>
                        </div>

                        <button type="submit" class="submit-btn" style="margin-top:15px;">スジを投稿する</button>
                    </form>
                </div>
            </div>
        </section>

        <section id="history-view" class="view-section">
            <div class="search-box-card">
                <input type="text" id="searchInput" class="form-control search-input" placeholder="🔍 履歴を検索" oninput="filterHistory()">
                <div class="filter-buttons">
                    <button class="filter-btn active" id="btn-all" onclick="setDateFilter('all', this)">全件</button>
                    <button class="filter-btn" id="btn-today" onclick="setDateFilter('today', this)">今日</button>
                    <button class="filter-btn" id="btn-weekday" onclick="setDateFilter('weekday', this)">平日</button>
                    <button class="filter-btn" id="btn-holiday" onclick="setDateFilter('holiday', this)">休日</button>
                </div>
            </div>
            <div class="section-header"><h2>投稿履歴一覧</h2></div>
            <div id="history-list"><p class="empty-msg">読み込み中...</p></div>
        </section>

        <section id="syotei-view" class="view-section">
            <div class="search-box-card">
                <input type="text" id="sujiSearchInput" class="form-control search-input" placeholder="🔍 列番でスジを検索" oninput="filterSuji()">
                <div class="filter-buttons">
                    <button class="filter-btn active" id="btn-suji-weekday" onclick="setSujiDayFilter('weekday', this)">平日</button>
                    <button class="filter-btn" id="btn-suji-holiday" onclick="setSujiDayFilter('holiday', this)">休日</button>
                </div>
            </div>
            <div class="section-header"><h2>スジ一覧</h2></div>
            <div id="suji-list"><p class="empty-msg">該当するスジはありません。</p></div>
        </section>

        <section id="account-view" class="view-section">
            <div class="section-header"><h2>設定</h2></div>
            <div class="form-card">
                <h3 style="margin-top:0; font-size:16px;">アプリ内ユーザー名</h3>
                <div class="form-group">
                    <label for="userNameInput">ユーザー名 <span style="color:red;">*</span></label>
                    <input type="text" id="userNameInput" class="form-control" maxlength="10" placeholder="例: 名鉄ファン">
                </div>
                <button type="button" class="submit-btn" style="background-color: #28a745;" onclick="saveLocalUserName()">名前を保存する</button>
            </div>
        </section>
    </main>

    <div id="historyModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle" style="margin:0; color:#d0021b;">運用履歴</h3>
                <button class="close-modal-btn" onclick="closeModal()">✕ 閉じる</button>
            </div>
            <div id="modalTimeline"></div>
        </div>
    </div>

    <div id="sujiModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="sujiModalTitle" style="margin:0; color:#d0021b;">スジ詳細情報</h3>
                <button class="close-modal-btn" onclick="closeSujiModal()">✕ 閉じる</button>
            </div>
            <div id="sujiModalBody"></div>
        </div>
    </div>

    <footer>
        <nav class="footer-nav">
            <button class="footer-btn active" onclick="switchView('latest-view', this)">最新<br>情報</button>
            <button class="footer-btn" onclick="switchView('manual-view', this)">説明</button>
            <button class="footer-btn" onclick="switchView('post-view', this)">投稿欄</button>
            <button class="footer-btn" onclick="switchView('history-view', this)">履歴</button>
            <button class="footer-btn" onclick="switchView('syotei-view', this)">スジ</button>
            <button class="footer-btn" onclick="switchView('account-view', this)">設定</button>
        </nav>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCiIeI-zgZuz14H1eUGzZQ-M_VaYJSHhEg",
            authDomain: "meitetsu-kaisou-app.firebaseapp.com",
            projectId: "meitetsu-kaisou-app",
            storageBucket: "meitetsu-kaisou-app.firebasestorage.app",
            messagingSenderId: "231322663764",
            appId: "1:231322663764:web:9958046e4ab2a31df7e6c1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let postsData = [];
        let sujiData = [];
        let currentFilter = 'all';
        let currentSujiDayFilter = 'weekday';
        let selectedPostSchedule = null;
        let selectedDirectionType = null;
        let selectedSujiPostSchedule = null;
        let isCouplingActive = false;
        let isSingleUnknownActive = false;
        let couplingCount = 2;

        window.addEventListener('DOMContentLoaded', () => {
            fetchPostsFromFirestore();
            fetchSujiFromFirestore();
            initUserName();
        });

        function initUserName() {
            const savedName = localStorage.getItem('meitetsu_user_name');
            if (savedName) document.getElementById('userNameInput').value = savedName;
        }

        function saveLocalUserName() {
            const newName = document.getElementById('userNameInput').value.trim();
            if (!newName) { alert('ユーザー名を入力してください。'); return; }
            localStorage.setItem('meitetsu_user_name', newName);
            alert('ユーザー名を保存しました！');
        }

        function fetchPostsFromFirestore() {
            db.collection("posts").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                postsData = [];
                snapshot.forEach(doc => { let d = doc.data(); d.id = doc.id; postsData.push(d); });
                filterHistory();
            });
        }

        function fetchSujiFromFirestore() {
            db.collection("suji_posts").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                sujiData = [];
                snapshot.forEach(doc => { let d = doc.data(); d.id = doc.id; sujiData.push(d); });
                filterSuji();
            });
        }

        function switchView(viewId, btnElement) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.footer-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            if (btnElement) btnElement.classList.add('active');
        }

        function switchSubTab(type) {
            document.getElementById('subTabWitnessBtn').classList.toggle('active', type === 'witness');
            document.getElementById('subTabSujiBtn').classList.toggle('active', type === 'suji');
            document.getElementById('witnessFormSection').classList.toggle('active', type === 'witness');
            document.getElementById('sujiFormSection').classList.toggle('active', type === 'suji');
        }

        function selectPostSchedule(type) {
            selectedPostSchedule = type;
            document.getElementById('btn-post-weekday').classList.toggle('active', type === 'weekday');
            document.getElementById('btn-post-holiday').classList.toggle('active', type === 'holiday');
        }

        function selectSujiPostSchedule(type) {
            selectedSujiPostSchedule = type;
            document.getElementById('btn-suji-post-weekday').classList.toggle('active', type === 'weekday');
            document.getElementById('btn-suji-post-holiday').classList.toggle('active', type === 'holiday');
        }

        function selectDirectionType(type) {
            selectedDirectionType = type;
            document.getElementById('btn-dir-houmen').classList.toggle('active', type === '方面');
            document.getElementById('btn-dir-yukisaki').classList.toggle('active', type === '行先');
        }

        function toggleSingleUnknown() {
            isSingleUnknownActive = !isSingleUnknownActive;
            document.getElementById('singleUnknownBtn').classList.toggle('active', isSingleUnknownActive);
            const input = document.getElementById('formation');
            input.disabled = isSingleUnknownActive;
            if (isSingleUnknownActive) input.value = '';
        }

        function toggleCoupling() {
            isCouplingActive = !isCouplingActive;
            const btn = document.getElementById('couplingToggleBtn');
            btn.innerText = isCouplingActive ? 'ON' : 'OFF';
            btn.classList.toggle('active', isCouplingActive);
            document.getElementById('couplingInputsArea').classList.toggle('active', isCouplingActive);
            if (isCouplingActive) renderCouplingFields();
        }

        function renderCouplingFields() {
            const container = document.getElementById('couplingInputsList');
            let html = '';
            for (let i = 0; i < couplingCount; i++) {
                html += `<div class="coupling-item-box"><input type="text" class="form-control coupling-field" inputmode="numeric" placeholder="3501" maxlength="4" oninput="onlyNumbers(this)"><button type="button" class="coupling-unknown-btn" onclick="toggleCouplingItemUnknown(this)">不明</button></div>`;
            }
            container.innerHTML = html;
        }

        function toggleCouplingItemUnknown(btn) {
            btn.classList.toggle('active');
            const input = btn.closest('.coupling-item-box').querySelector('.coupling-field');
            input.disabled = btn.classList.contains('active');
            if (input.disabled) input.value = '';
        }

        function addCouplingField() { if (couplingCount < 4) { couplingCount++; renderCouplingFields(); } }
        function removeCouplingField() { if (couplingCount > 2) { couplingCount--; renderCouplingFields(); } }

        function addSujiMiddleStationField() {
            const container = document.getElementById('sujiMiddleStationsContainer');
            const index = container.children.length;
            const div = document.createElement('div');
            div.className = 'suji-station-box';
            div.innerHTML = `
                <div class="suji-station-header"><span>途中駅 #${index + 1}</span><button type="button" class="coupling-action-btn btn-remove-red" onclick="this.closest('.suji-station-box').remove()">✕</button></div>
                <div class="suji-inline-row">
                    <div class="form-group"><label style="font-size:12px;">駅名 *</label><input type="text" class="form-control middle-station-name" placeholder="駅名" required></div>
                    <div class="form-group"><label style="font-size:12px;">種別 *</label><select class="form-control middle-station-type" onchange="toggleMiddleTimeFields(this)"><option value="passing">通過</option><option value="stopping">運転停車</option></select></div>
                </div>
                <div class="middle-time-area-passing form-group" style="margin-bottom:0;"><label style="font-size:12px;">通過時間 *</label><input type="text" class="form-control middle-pass-time" inputmode="numeric" maxlength="5" onblur="finalizeTimeFormat(this)"></div>
                <div class="middle-time-area-stopping form-group" style="margin-bottom:0; display:none;">
                    <div style="display:flex; gap:6px;">
                        <div style="flex:1;"><label style="font-size:12px;">到着</label><input type="text" class="form-control middle-arr-time" inputmode="numeric" maxlength="5" onblur="finalizeTimeFormat(this)"></div>
                        <div style="flex:1;"><label style="font-size:12px;">発車</label><input type="text" class="form-control middle-dep-time" inputmode="numeric" maxlength="5" onblur="finalizeTimeFormat(this)"></div>
                    </div>
                </div>
            `;
            container.appendChild(div);
        }

        function toggleMiddleTimeFields(selectElem) {
            const box = selectElem.closest('.suji-station-box');
            box.querySelector('.middle-time-area-passing').style.display = selectElem.value === 'passing' ? 'block' : 'none';
            box.querySelector('.middle-time-area-stopping').style.display = selectElem.value === 'stopping' ? 'block' : 'none';
        }

        function onlyNumbers(input) { input.value = input.value.replace(/[^0-9]/g, ''); }

        function finalizeTimeFormat(input) {
            let raw = input.value.replace(/[^0-9]/g, '');
            if (!raw) { input.value = ''; return; }
            let h = 0, m = 0;
            if (raw.length === 3) { h = parseInt(raw.slice(0, 1), 10); m = parseInt(raw.slice(1, 3), 10); }
            else if (raw.length === 4) { h = parseInt(raw.slice(0, 2), 10); m = parseInt(raw.slice(2, 4), 10); }
            else if (raw.length <= 2) { h = parseInt(raw, 10); m = 0; }
            else { input.value = ''; return; }
            if (m > 59) m = 59;
            if (h >= 24) h = h % 24;
            input.value = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        async function handleSujiPost(event) {
            event.preventDefault();
            const authorName = localStorage.getItem('meitetsu_user_name');
            if (!authorName) { alert('「設定」画面からユーザー名を設定してください。'); switchView('account-view', document.querySelectorAll('.footer-btn')[5]); return; }
            if (!selectedSujiPostSchedule) { alert('ダイヤ種別を選択してください。'); return; }

            const trainNumber = document.getElementById('sujiTrainNumber').value.trim();
            const syotei = document.getElementById('sujiSyotei').value.trim();
            const startName = document.getElementById('sujiStartStationName').value.trim();
            const startEnter = document.getElementById('sujiStartEnterTime').value.trim();
            const startDep = document.getElementById('sujiStartDepTime').value.trim();

            if (!startName || !startDep) { alert('始発駅の駅名と発車時間は必須です。'); return; }

            let stations = [{ name: startName, type: 'start', enterTime: startEnter, depTime: startDep, marker: '■' }];

            const middleBoxes = document.querySelectorAll('#sujiMiddleStationsContainer .suji-station-box');
            for (let box of middleBoxes) {
                const mName = box.querySelector('.middle-station-name').value.trim();
                const mType = box.querySelector('.middle-station-type').value;
                if (!mName) continue;
                if (mType === 'passing') {
                    const mPass = box.querySelector('.middle-pass-time').value.trim();
                    if (!mPass) { alert(`途中駅「${mName}」の通過時間が未入力です。`); return; }
                    stations.push({ name: mName, type: 'passing', passTime: mPass, marker: '□' });
                } else {
                    const mArr = box.querySelector('.middle-arr-time').value.trim();
                    const mDep = box.querySelector('.middle-dep-time').value.trim();
                    if (!mArr || !mDep) { alert(`途中駅「${mName}」の時間を確認してください。`); return; }
                    stations.push({ name: mName, type: 'stopping', arrTime: mArr, depTime: mDep, marker: '□' });
                }
            }

            const endName = document.getElementById('sujiEndStationName').value.trim();
            const endArr = document.getElementById('sujiEndArrTime').value.trim();
            if (!endName || !endArr) { alert('終着駅の駅名と到着時刻は必須です。'); return; }

            stations.push({ name: endName, type: 'end', arrTime: endArr, marker: '■' });

            try {
                await db.collection("suji_posts").add({
                    trainNumber, syotei, stations, authorName,
                    isHoliday: (selectedSujiPostSchedule === 'holiday'),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('sujiPostForm').reset();
                document.getElementById('sujiMiddleStationsContainer').innerHTML = '';
                selectSujiPostSchedule(null);
                alert('スジの投稿が完了しました！');
                switchView('syotei-view', document.querySelectorAll('.footer-btn')[4]);
            } catch (e) { alert('保存に失敗しました。'); }
        }

        async function handlePost(event) {
            event.preventDefault();
            const authorName = localStorage.getItem('meitetsu_user_name');
            if (!authorName) { alert('「設定」画面からユーザー名を設定してください。'); switchView('account-view', document.querySelectorAll('.footer-btn')[5]); return; }
            if (!selectedPostSchedule) { alert('ダイヤ種別を選択してください。'); return; }
            if (!selectedDirectionType) { alert('方面または行先を選択してください。'); return; }

            const passingTime = document.getElementById('passingTime').value.trim();
            const arrivalTime = document.getElementById('arrivalTime').value.trim();
            const departureTime = document.getElementById('departureTime').value.trim();
            if (!passingTime && !arrivalTime && !departureTime) { alert('時刻を少なくとも1つ入力してください。'); return; }

            let formationStr = isSingleUnknownActive ? '不明' : document.getElementById('formation').value.trim();
            if (!isSingleUnknownActive && !formationStr) { alert('編成番号を入力してください。'); return; }

            if (isCouplingActive) {
                let subFormations = [];
                let hasError = false;
                document.querySelectorAll('#couplingInputsList .coupling-item-box').forEach(box => {
                    const btn = box.querySelector('.coupling-unknown-btn');
                    const input = box.querySelector('.coupling-field');
                    if (btn.classList.contains('active')) subFormations.push('不明');
                    else { const val = input.value.trim(); if (!val) hasError = true; subFormations.push(val); }
                });
                if (hasError) { alert('併結する編成番号を正しく入力してください。'); return; }
                formationStr += ' + ' + subFormations.join(' + ');
            }

            try {
                await db.collection("posts").add({
                    trainNumber: document.getElementById('trainNumber').value.trim(),
                    station: document.getElementById('station').value.trim(),
                    directionType: selectedDirectionType,
                    direction: document.getElementById('direction').value.trim(),
                    formation: formationStr,
                    passingTime, arrivalTime, departureTime,
                    remarks: document.getElementById('remarks').value.trim(),
                    authorName,
                    isHoliday: (selectedPostSchedule === 'holiday'),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('postForm').reset();
                selectPostSchedule(null);
                selectDirectionType(null);
                isSingleUnknownActive = false;
                document.getElementById('formation').disabled = false;
                document.getElementById('singleUnknownBtn').classList.remove('active');
                if (isCouplingActive) toggleCoupling();
                alert('投稿が完了しました！');
                switchView('history-view', document.querySelectorAll('.footer-btn')[3]);
            } catch (e) { alert('データの保存に失敗しました。'); }
        }

        function filterHistory() {
            const container = document.getElementById('history-list');
            if (!container) return;
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = postsData.filter(post => {
                const matchesKeyword = !keyword || Object.values(post).some(val => String(val).toLowerCase().includes(keyword));
                if (!matchesKeyword) return false;
                if (currentFilter === 'weekday') return !post.isHoliday;
                if (currentFilter === 'holiday') return post.isHoliday;
                return true;
            });

            if (filtered.length === 0) { container.innerHTML = '<p class="empty-msg">投稿履歴はありません。</p>'; return; }

            let html = '';
            filtered.forEach(post => {
                let timeInfo = [];
                if (post.passingTime) timeInfo.push(`通:${post.passingTime}`);
                if (post.arrivalTime) timeInfo.push(`着:${post.arrivalTime}`);
                if (post.departureTime) timeInfo.push(`発:${post.departureTime}`);
                let timeStr = timeInfo.length > 0 ? timeInfo.join(' / ') : '';
                let dateStr = post.timestamp ? (() => { const d = post.timestamp.toDate(); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; })() : '';

                html += `
                    <div class="post-card ${post.isHoliday ? 'holiday' : 'weekday'}" onclick="openModal('${post.trainNumber}')" style="cursor: pointer;">
                        <div class="post-header"><span class="post-title">列番: ${post.trainNumber || '不明'}</span><span style="font-size:12px; font-weight:bold;">${post.isHoliday ? '休日' : '平日'}</span></div>
                        <div class="post-details"><div>確認駅: <strong>${post.station}</strong></div><div>${post.directionType || '方面'}: <strong>${post.direction}</strong></div></div>
                        <div class="post-details"><div>編成: <strong>${post.formation}</strong></div><div style="font-size:13px; color:#555;">${timeStr}</div></div>
                        ${post.remarks ? `<div class="post-remarks">備考: ${post.remarks}</div>` : ''}
                        <div style="display:flex; justify-content:space-between; margin-top:8px;"><span style="font-size:11px; color:#666;">投稿者: ${post.authorName || '名無し'}</span><span style="font-size:11px; color:#888;">${dateStr}</span></div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function setDateFilter(type, btn) {
            currentFilter = type;
            document.querySelectorAll('#history-view .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterHistory();
        }

        function setSujiDayFilter(dayType, btn) {
            currentSujiDayFilter = dayType;
            document.querySelectorAll('#syotei-view .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterSuji();
        }

        function filterSuji() {
            const container = document.getElementById('suji-list');
            const keyword = document.getElementById('sujiSearchInput').value.toLowerCase().trim();
            const isHoliday = (currentSujiDayFilter === 'holiday');

            const filtered = sujiData.filter(suji => suji.isHoliday === isHoliday && (!keyword || suji.trainNumber.toLowerCase().includes(keyword)));
            if (filtered.length === 0) { container.innerHTML = '<p class="empty-msg">該当するスジはありません。</p>'; return; }

            let html = '';
            filtered.forEach(suji => {
                let routeSummary = '';
                if (suji.stations && suji.stations.length > 0) {
                    const startSt = suji.stations[0];
                    const endSt = suji.stations[suji.stations.length - 1];
                    routeSummary = `${startSt.name} ${startSt.depTime || startSt.enterTime || ''} ➔ ${endSt.name} ${endSt.arrTime || ''}`;
                }
                html += `
                    <div class="suji-card" onclick="openSujiModal('${suji.id}')">
                        <div class="suji-card-header"><span style="color: #d0021b;">列番: ${suji.trainNumber}</span><span style="font-size: 13px;">${suji.syotei}</span></div>
                        <div style="font-size: 14px; color: #444; margin-top: 6px; font-weight: bold;">${routeSummary}</div>
                        <div style="display: flex; justify-content: flex-end; margin-top: 4px;"><span style="font-size: 11px; color: #666;">投稿者: ${suji.authorName || '名無し'}</span></div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function openModal(trainNumber) {
            if (!trainNumber || trainNumber === '不明') return;
            document.getElementById('modalTitle').innerText = `列番: ${trainNumber} の運用履歴`;
            const matched = postsData.filter(p => p.trainNumber === trainNumber);
            let html = matched.length === 0 ? '<p class="empty-msg">履歴が見つかりません。</p>' : '';
            matched.forEach(p => {
                let timeStr = [p.passingTime && `通:${p.passingTime}`, p.arrivalTime && `着:${p.arrivalTime}`, p.departureTime && `発:${p.departureTime}`].filter(Boolean).join(' / ');
                html += `<div class="suji-timeline-row" style="flex-direction:column; align-items:flex-start; gap:4px;">
                    <div style="display:flex; width:100%; justify-content:space-between;"><strong>${p.station} (${p.directionType}: ${p.direction})</strong><span style="font-size:12px; color:#d0021b;">${p.isHoliday ? '休日' : '平日'}</span></div>
                    <div>編成: <strong>${p.formation}</strong> ${timeStr ? `/ ${timeStr}` : ''}</div>
                    ${p.remarks ? `<div style="font-size:12px; color:#666;">備考: ${p.remarks}</div>` : ''}
                    <div style="display:flex; justify-content:space-between; width:100%;"><span style="font-size:11px; color:#666;">投稿者: ${p.authorName}</span></div>
                </div>`;
            });
            document.getElementById('modalTimeline').innerHTML = html;
            document.getElementById('historyModal').style.display = 'flex';
        }

        function openSujiModal(id) {
            const suji = sujiData.find(s => s.id === id);
            if (!suji) return;
            document.getElementById('sujiModalTitle').innerText = `列番: ${suji.trainNumber} のスジ詳細`;
            let html = `<div style="font-size:14px; font-weight:bold; margin-bottom:10px; color:#d0021b;">所定: ${suji.syotei}</div>`;
            suji.stations.forEach(st => {
                let timeStr = st.type === 'start' ? (st.enterTime ? `入:${st.enterTime} ` : '') + `発:${st.depTime}` : st.type === 'end' ? `着:${st.arrTime}` : st.type === 'passing' ? `通:${st.passTime}` : `着:${st.arrTime} / 発:${st.depTime}`;
                html += `<div class="suji-timeline-row"><div><strong>${st.marker} ${st.name}</strong></div><div style="font-weight:bold;">${timeStr}</div></div>`;
            });
            html += `<div style="display:flex; justify-content:flex-end; margin-top:10px;"><span style="font-size:11px; color:#666;">投稿者: ${suji.authorName}</span></div>`;
            document.getElementById('sujiModalBody').innerHTML = html;
            document.getElementById('sujiModal'].style = 'flex'; // Fix typo
            document.getElementById('sujiModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('historyModal').style.display = 'none'; }
        function closeSujiModal() { document.getElementById('sujiModal').style.display = 'none'; }
    </script>
</body>
</html>
