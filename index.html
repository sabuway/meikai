<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名鉄回送情報共有</title>
    <style>
        /* 全体の基本設定 */
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #f5f5f5;
            padding-bottom: 90px;
        }

        /* ヘッダー */
        header {
            background-color: #d0021b;
            color: #ffffff;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: bold;
        }

        /* メインコンテンツエリア */
        main {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* ビュー切替 */
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }

        /* フォーム・カードデザイン */
        .form-card, .info-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }

        /* お知らせカード */
        .news-item {
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .news-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }
        .news-date {
            font-size: 12px;
            color: #d0021b;
            font-weight: bold;
        }
        .news-title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin: 4px 0;
        }
        .news-body {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        /* 投稿カード (平日:白 / 休日:薄ピンク) */
        .post-card {
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }

        .post-card.weekday {
            background-color: #ffffff;
        }
        .post-card.holiday {
            background-color: #fff0f3;
            border: 1px solid #ffccd5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
            color: #333;
        }

        .optional-badge {
            font-size: 11px;
            background-color: #e0e0e0;
            color: #666;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }

        .form-control:focus {
            border-color: #d0021b;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        /* 検索・フィルターエリア */
        .search-box-card {
            background: #ffffff;
            padding: 14px 16px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            margin-bottom: 15px;
        }

        .search-input {
            border-color: #ddd;
            background-color: #fafafa;
            margin-bottom: 10px;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            flex: 1;
            padding: 8px 0;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-color: #f9f9f9;
            color: #555;
            cursor: pointer;
        }

        .filter-btn.active {
            background-color: #d0021b;
            color: #ffffff;
            border-color: #d0021b;
        }

        .submit-btn {
            width: 100%;
            background-color: #d0021b;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        /* 投稿カード内ヘッダー */
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #d0021b;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .post-title {
            font-size: 17px;
            font-weight: bold;
            color: #d0021b;
        }

        .post-time-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 同一列番 運用履歴ボタン */
        .history-btn {
            background-color: #007bff;
            color: #ffffff;
            border: none;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .post-time {
            font-size: 14px;
            color: #444;
            font-weight: bold;
        }

        .post-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
        }

        .post-remarks {
            background-color: rgba(0,0,0,0.03);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #555;
            margin-top: 8px;
        }

        .empty-msg {
            text-align: center;
            color: #888;
            padding: 30px 0;
        }

        /* モーダル（運用履歴の表示ポップアップ） */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #ffffff;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #d0021b;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .close-modal-btn {
            background: #eee;
            border: none;
            font-size: 16px;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* 運用履歴タイムライン */
        .timeline-item {
            border-left: 3px solid #d0021b;
            padding-left: 12px;
            margin-bottom: 15px;
            position: relative;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 0;
            width: 9px;
            height: 9px;
            background: #d0021b;
            border-radius: 50%;
        }

        /* フッター固定ナビ */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            border-top: 1px solid #e0e0e0;
            z-index: 100;
        }

        .footer-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 80px;
        }

        .footer-btn {
            background-color: #eeeeee;
            border: none;
            color: #333333;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .footer-btn.active {
            background-color: #d0021b;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <h1>名鉄回送情報共有</h1>
    </header>

    <main>
        <!-- 1. 最新情報画面（アプリの運営・案内専用） -->
        <section id="latest-view" class="view-section active">
            <h2 style="font-size: 18px; color: #333;">最新のお知らせ</h2>
            <div class="info-card">
                <div class="news-item">
                    <div class="news-date">8月13日</div>
                    <div class="news-title">「名鉄回送情報共有」公開</div>
                    <div class="news-body">
                        名鉄回送情報共有Webアプリを公開しました。回送情報の検索や運用履歴の確認が可能です。
                    </div>
                </div>
            </div>
        </section>

        <!-- 2. 投稿欄画面 -->
        <section id="post-view" class="view-section">
            <div class="form-card">
                <h2 style="margin-top:0; font-size:18px; color:#d0021b;">回送情報の投稿</h2>
                <form id="postForm" onsubmit="handlePost(event)">
                    
                    <!-- ① 列番（内部で最大5文字制限） -->
                    <div class="form-group">
                        <label for="trainNumber">列番 <span class="optional-badge">任意</span></label>
                        <input type="text" id="trainNumber" class="form-control" placeholder="例: K2461" maxlength="5">
                    </div>

                    <!-- ② 確認駅（内部で最大30文字制限） -->
                    <div class="form-group">
                        <label for="station">確認駅 <span style="color:red;">*</span></label>
                        <input type="text" id="station" class="form-control" placeholder="例: 須ヶ口" maxlength="30" required>
                    </div>

                    <!-- ③ 方面（内部で最大30文字制限） -->
                    <div class="form-group">
                        <label for="direction">方面 <span style="color:red;">*</span></label>
                        <input type="text" id="direction" class="form-control" placeholder="例: 犬山" maxlength="30" required>
                    </div>

                    <!-- ④ 編成番号（内部で4桁限定） -->
                    <div class="form-group">
                        <label for="formation">編成番号 <span style="color:red;">*</span></label>
                        <input type="text" id="formation" class="form-control" inputmode="numeric" pattern="[0-9]{4}" placeholder="例: 3501" maxlength="4" oninput="onlyNumbers(this)" required>
                    </div>

                    <!-- ⑤ 発車時刻 -->
                    <div class="form-group">
                        <label for="departureTime">発車時刻 <span style="color:red;">*</span></label>
                        <input type="text" id="departureTime" class="form-control" inputmode="numeric" placeholder="例: 02:34 または 234" maxlength="5" onblur="finalizeTimeFormat(this)" required>
                    </div>

                    <!-- ⑥ 備考欄 -->
                    <div class="form-group">
                        <label for="remarks">備考欄 <span class="optional-badge">任意</span></label>
                        <textarea id="remarks" class="form-control" placeholder="備考情報"></textarea>
                    </div>

                    <button type="submit" class="submit-btn">投稿する</button>
                </form>
            </div>
        </section>

        <!-- 3. 履歴画面 (全投稿・検索はこちら) -->
        <section id="history-view" class="view-section">
            <div class="search-box-card">
                <input type="text" id="searchInput" class="form-control search-input" placeholder="🔍 履歴を検索 (駅名・方面・列番など)" oninput="filterHistory()">
                <div class="filter-buttons">
                    <button class="filter-btn active" id="btn-all" onclick="setDateFilter('all', this)">全件</button>
                    <button class="filter-btn" id="btn-today" onclick="setDateFilter('today', this)">今日</button>
                    <button class="filter-btn" id="btn-weekday" onclick="setDateFilter('weekday', this)">平日</button>
                    <button class="filter-btn" id="btn-holiday" onclick="setDateFilter('holiday', this)">休日</button>
                </div>
            </div>

            <h2 style="font-size: 18px; color: #333;">投稿履歴一覧</h2>
            <div id="history-list">
                <p class="empty-msg">過去の投稿履歴はありません。</p>
            </div>
        </section>
    </main>

    <!-- 運用履歴モーダル (ポップアップ) -->
    <div id="historyModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle" style="margin:0; color:#d0021b;">列番の運用履歴</h3>
                <button class="close-modal-btn" onclick="closeModal()">✕ 閉じる</button>
            </div>
            <div id="modalTimeline"></div>
        </div>
    </div>

    <!-- フッターボタン -->
    <footer>
        <nav class="footer-nav">
            <button class="footer-btn active" onclick="switchView('latest-view', this)">最新<br>情報</button>
            <button class="footer-btn" onclick="switchView('post-view', this)">投稿欄</button>
            <button class="footer-btn" id="history-nav-btn" onclick="switchView('history-view', this)">履歴</button>
        </nav>
    </footer>

    <script>
        const postsData = [];
        let currentFilter = 'all';

        function switchView(viewId, btnElement) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.footer-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            btnElement.classList.add('active');
        }

        // 数字のみ制限
        function onlyNumbers(input) {
            input.value = input.value.replace(/[^0-9]/g, '');
        }

        // 時刻の厳格チェックと24時以降（24時→00時 / 25時→01時）補正関数
        function finalizeTimeFormat(input) {
            let raw = input.value.replace(/[^0-9]/g, '');
            if (!raw) return;

            let h = 0;
            let m = 0;

            if (raw.length === 3) {
                h = parseInt(raw.slice(0, 1), 10);
                m = parseInt(raw.slice(1, 3), 10);
            } else if (raw.length === 4) {
                h = parseInt(raw.slice(0, 2), 10);
                m = parseInt(raw.slice(2, 4), 10);
            } else if (raw.length <= 2) {
                h = parseInt(raw, 10);
                m = 0;
            } else {
                alert('時刻は「02:30」や「230」のように正しい形式で入力してください。');
                input.value = '';
                return;
            }

            // 分の妥当性チェック
            if (m < 0 || m > 59) {
                alert('分は00～59の間で入力してください。');
                input.value = '';
                return;
            }

            // 24時以降は翌日の時間（24時→00時, 25時→01時など）に変換
            if (h >= 24) {
                h = h % 24;
            }

            const formattedH = String(h).padStart(2, '0');
            const formattedM = String(m).padStart(2, '0');
            input.value = `${formattedH}:${formattedM}`;
        }

        function handlePost(event) {
            event.preventDefault();

            const formationInput = document.getElementById('formation').value.trim();
            if (formationInput.length !== 4) {
                alert('編成番号は4桁の数字で入力してください。');
                return;
            }

            const depTimeInput = document.getElementById('departureTime');
            finalizeTimeFormat(depTimeInput);
            if (!depTimeInput.value) return;

            const trainNum = document.getElementById('trainNumber').value.trim() || '指定なし';
            const station = document.getElementById('station').value.trim();
            const rawDirection = document.getElementById('direction').value.trim();
            const directionFormatted = rawDirection.endsWith('方面') ? rawDirection : rawDirection + '（方面）';
            const formation = formationInput;
            const depTime = depTimeInput.value;
            const remarks = document.getElementById('remarks').value.trim() || 'なし';

            const now = new Date();
            const dayOfWeek = now.getDay();
            const isHoliday = (dayOfWeek === 0 || dayOfWeek === 6);
            const dateStr = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()}`;
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            const newPost = {
                trainNum: trainNum,
                station: station,
                direction: directionFormatted,
                formation: formation + 'F',
                depTime: depTime,
                remarks: remarks,
                postDate: `${now.getMonth() + 1}/${now.getDate()} ${timeStr}`,
                rawDate: dateStr,
                isHoliday: isHoliday
            };

            postsData.unshift(newPost);
            filterHistory();

            document.getElementById('postForm').reset();
            alert('投稿が完了しました！');
            switchView('history-view', document.getElementById('history-nav-btn'));
        }

        function getTrainNumCount(trainNum) {
            if (!trainNum || trainNum === '指定なし') return 0;
            return postsData.filter(p => p.trainNum === trainNum).length;
        }

        function openOperationHistory(trainNum) {
            const modal = document.getElementById('historyModal');
            const title = document.getElementById('modalTitle');
            const timeline = document.getElementById('modalTimeline');

            title.innerText = `列番: ${trainNum} の運用履歴`;

            const matchingPosts = postsData
                .filter(p => p.trainNum === trainNum)
                .sort((a, b) => a.depTime.localeCompare(b.depTime));

            let timelineHTML = '';
            matchingPosts.forEach(post => {
                timelineHTML += `
                    <div class="timeline-item">
                        <div style="font-weight:bold; color:#d0021b;">${post.depTime} 発 - ${post.station}</div>
                        <div style="font-size:13px; color:#333; margin-top:2px;">
                            ${post.direction} | 編成: ${post.formation}
                        </div>
                        <div style="font-size:12px; color:#666; margin-top:2px;">
                            備考: ${post.remarks} (${post.postDate})
                        </div>
                    </div>
                `;
            });

            timeline.innerHTML = timelineHTML;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('historyModal').style.display = 'none';
        }

        function createPostCardHTML(post) {
            const cardClass = post.isHoliday ? 'post-card holiday' : 'post-card weekday';
            const sameCount = getTrainNumCount(post.trainNum);

            let historyBtnHTML = '';
            if (sameCount >= 2) {
                historyBtnHTML = `<button class="history-btn" onclick="openOperationHistory('${post.trainNum}')">運用履歴</button>`;
            }

            return `
                <div class="${cardClass}">
                    <div class="post-header">
                        <span class="post-title">${post.station} ➔ ${post.direction}</span>
                        <div class="post-time-container">
                            ${historyBtnHTML}
                            <span class="post-time">発車: ${post.depTime}</span>
                        </div>
                    </div>
                    <div class="post-details">
                        <div><strong>列番:</strong> ${post.trainNum}</div>
                        <div><strong>編成:</strong> ${post.formation}</div>
                    </div>
                    <div class="post-remarks">
                        <strong>備考:</strong> ${post.remarks}
                    </div>
                    <div style="font-size: 11px; color: #888; text-align: right; margin-top: 6px;">
                        ${post.isHoliday ? '【休日】' : '【平日】'} ${post.postDate}
                    </div>
                </div>
            `;
        }

        function setDateFilter(filterType, btnElement) {
            currentFilter = filterType;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            filterHistory();
        }

        function filterHistory() {
            const historyContainer = document.getElementById('history-list');
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();

            if (postsData.length === 0) {
                historyContainer.innerHTML = '<p class="empty-msg">過去の投稿履歴はありません。</p>';
                return;
            }

            const now = new Date();
            const todayStr = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()}`;

            const filteredPosts = postsData.filter(post => {
                const combinedText = `${post.station} ${post.direction} ${post.trainNum} ${post.formation} ${post.remarks}`.toLowerCase();
                const matchesKeyword = combinedText.includes(keyword);

                let matchesDate = true;
                if (currentFilter === 'today') matchesDate = (post.rawDate === todayStr);
                else if (currentFilter === 'weekday') matchesDate = (!post.isHoliday);
                else if (currentFilter === 'holiday') matchesDate = (post.isHoliday);

                return matchesKeyword && matchesDate;
            });

            if (filteredPosts.length === 0) {
                historyContainer.innerHTML = '<p class="empty-msg">該当する履歴が見つかりませんでした。</p>';
                return;
            }

            let historyHtml = '';
            filteredPosts.forEach(post => {
                historyHtml += createPostCardHTML(post);
            });
            historyContainer.innerHTML = historyHtml;
        }
    </script>
</body>
</html>
