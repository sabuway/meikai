<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名鉄回送情報共有</title>
    <style>
        /* ページの余白をリセット */
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        /* ヘッダーのデザイン（背景赤・文字白） */
        header {
            background-color: #d0021b; /* 名鉄カラー風の赤 */
            color: #ffffff;            /* 文字色：白 */
            padding: 15px 20px;       /* 上下左右の余白 */
            text-align: center;        /* 文字を中央揃え */
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); /* ちょっとした影 */
        }

        /* ヘッダーの中の文字（h1）のデザイン */
        header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: bold;
        }

        /* メインコンテンツ用のエリア */
        main {
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- 👇 ここからがヘッダー部分です -->
    <header>
        <h1>名鉄回送情報共有</h1>
    </header>
    <!-- 👆 ここまで -->

    <main>
        <p>ここに回送情報のコンテンツが入ります。</p>
    </main>

</body>
</html>
